name: freezed_result
description: A Dart package providing Result types for better error handling using freezed.
version: 1.0.0
homepage: https://github.com/yourusername/freezed_result
repository: https://github.com/yourusername/freezed_result
issue_tracker: https://github.com/yourusername/freezed_result/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
