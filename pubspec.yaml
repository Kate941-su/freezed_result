name: fresult
description: A Dart package providing Result types for better error handling with freezed.
version: 1.1.1
homepage: https://github.com/Kate941-su/freezed_result
repository: https://github.com/Kate941-su/freezed_result
issue_tracker: https://github.com/Kate941-su/freezed_result/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

# When you custom your own fresult version, you can uncomment the following dependencies and dev_dependencies
# dependencies:


dependencies:
  freezed_annotation: ^3.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
  build_runner: 2.7.1
  freezed: ^3.1.0


topics:
  - result
  - error-handling
  - freezed
  - functional-programming

